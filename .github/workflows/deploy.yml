name: Deploy to Hostinger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      # Pushes dist/ contents to the `dist` branch using incremental commits (no force push)
      - name: Push built files to dist branch
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/dist; then
            git worktree add /tmp/gh-pages origin/dist
          else
            git worktree add --orphan -b dist /tmp/gh-pages
          fi
          rsync -a --delete --exclude='.git' dist/ /tmp/gh-pages/
          cd /tmp/gh-pages
          git add -A
          git diff --cached --quiet || git commit -m "deploy"
          git push origin HEAD:dist

